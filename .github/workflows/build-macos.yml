name: Build macOS app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write  # only used to attach the zip to a GitHub Release on v* tags

env:
  PY_VERSION: "3.12.10"   # python.org universal2 installer (bundles a universal2 Tcl/Tk 8.6)

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # One-time cleanup: builds 11 and 12 point at history that was rewritten to remove a real
      # phone number from test data. Remove those releases and tags. Safe to re-run.
      - name: Remove releases built from pre-scrub history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in build-11 build-12 build-13; do
            gh release delete "$t" --cleanup-tag --yes -R "${{ github.repository }}" 2>/dev/null \
              || git push origin ":refs/tags/$t" 2>/dev/null || true
          done

      - name: Install universal2 Python from python.org
        run: |
          curl -fsSLo python.pkg "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          "$PY" -c "import sys, platform, tkinter; print(sys.version, platform.machine(), 'Tk', tkinter.TkVersion)"
          "$PY" -m venv venv
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"

      - name: Install build tools and universal2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install delocate pyinstaller==6.16.0
          python packaging/install_universal2_deps.py requirements.txt
          python -m pip install pytest pypdf

      - name: Unit tests
        run: python -m pytest -q

      - name: Stamp build number (the in-app updater compares these)
        run: echo "BUILD = ${{ github.run_number }}" > packslip/_build.py

      - name: Build .app
        run: pyinstaller --noconfirm packaging/PackSlipMaker.spec

      - name: Verify every binary runs on Intel + Apple Silicon
        # Fat binaries pass. A single-arch library is allowed only if no slice of the
        # *other* architecture links to it (e.g. Pillow bundles zlib under a different
        # filename per arch, so each slice loads its own thin copy).
        run: |
          APP="dist/Packs Be Slippin'.app"
          echo "Main executable: $(lipo -archs "$APP/Contents/MacOS/Packs Be Slippin'")"
          : > links.txt; : > thin.txt
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q "Mach-O" || continue
            case "$f" in */tkdnd/osx-*) continue ;; esac   # per-arch on purpose; chosen at runtime
            archs="$(lipo -archs "$f")"
            for a in $archs; do otool -arch "$a" -L "$f" | tail -n +2 | awk -v a="$a" '{print a, $1}' >> links.txt; done
            if [[ "$archs" != *x86_64* || "$archs" != *arm64* ]]; then echo "$archs $(basename "$f")" >> thin.txt; fi
          done < <(find "$APP" -type f -print0)
          bad=0
          while read -r arch name; do
            other=arm64; [[ "$arch" == arm64 ]] && other=x86_64
            if grep -q "^$other .*/$name$" links.txt; then echo "BROKEN: $name is $arch-only but $other code links to it"; bad=1
            else echo "ok (single-arch, used only by $arch): $name"; fi
          done < thin.txt
          exit $bad

      - name: Ad-hoc sign (required to launch on Apple Silicon)
        run: |
          codesign --force --deep --sign - "dist/Packs Be Slippin'.app"
          codesign --verify --deep --strict --verbose=2 "dist/Packs Be Slippin'.app"

      - name: Self-test (Apple Silicon)
        run: |
          "dist/Packs Be Slippin'.app/Contents/MacOS/Packs Be Slippin'" --selftest

      - name: Self-test (Intel, via Rosetta)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "dist/Packs Be Slippin'.app/Contents/MacOS/Packs Be Slippin'" --selftest
          else
            echo "::warning::Rosetta isn't installed on this runner; Intel slice not executed."
          fi

      - name: GUI smoke test
        continue-on-error: true
        run: |
          "dist/Packs Be Slippin'.app/Contents/MacOS/Packs Be Slippin'" --selftest-gui

      - name: Package zip (app + one-page instructions)
        run: |
          mkdir -p "release/Packs Be Slippin'"
          python tools/make_guide_pdf.py docs/OPERATOR_GUIDE.md "release/Packs Be Slippin'/How to use Packs Be Slippin'.pdf"
          ditto "dist/Packs Be Slippin'.app" "release/Packs Be Slippin'/Packs Be Slippin'.app"
          cd release && ditto -c -k --sequesterRsrc --keepParent "Packs Be Slippin'" ../Packs-Be-Slippin-mac.zip
          ls -lh ../Packs-Be-Slippin-mac.zip

      - name: Self-test the in-app update install (unzip, verify, swap)
        run: |
          "dist/Packs Be Slippin'.app/Contents/MacOS/Packs Be Slippin'" --selftest-update Packs-Be-Slippin-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Packs-Be-Slippin-mac
          path: Packs-Be-Slippin-mac.zip
          retention-days: 90

      # Installed apps check the latest release on launch and offer to update themselves.
      - name: Publish release for the in-app updater
        if: github.ref == 'refs/heads/claude/packslip-app' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Packs Be Slippin' (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: "true"
          files: Packs-Be-Slippin-mac.zip

      # Installed apps can only see releases if the repo is public. Prove this build is visible
      # to them: pretend to be build 1 and require the app (no GitHub login) to find this build,
      # once with curl and once with the built-in Python fallback.
      - name: Verify installed apps can see this update
        if: github.ref == 'refs/heads/claude/packslip-app' || github.ref == 'refs/heads/main'
        run: |
          APP="dist/Packs Be Slippin'.app/Contents/MacOS/Packs Be Slippin'"
          for i in 1 2 3 4 5 6; do   # GitHub can take a few seconds to list a new release
            PACKSLIP_PRETEND_BUILD=1 "$APP" --check-update | tee check.txt || true
            grep -q "newer release: build ${{ github.run_number }} " check.txt && break
            sleep 10
          done
          grep -q "newer release: build ${{ github.run_number }} " check.txt || {
            echo "::error::Installed apps can't see this release. Is the repository public?"; exit 1; }
          PACKSLIP_PRETEND_BUILD=1 PACKSLIP_UPDATE_NO_CURL=1 "$APP" --check-update | tee check2.txt
          grep -q "newer release: build ${{ github.run_number }} " check2.txt
